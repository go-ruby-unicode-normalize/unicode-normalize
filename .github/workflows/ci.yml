name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Track the latest stable Go (org convention). go.mod floor is 1.26.4.
jobs:
  # Build, vet, race-test, and enforce 100% coverage. The differential-vs-MRI
  # oracle tests skip themselves on Windows and where ruby is absent, and gate
  # on RUBY_VERSION >= "4.0" (Unicode 17.0.0); ruby-head is installed on the
  # ubuntu/macos lanes so the oracle runs there. The deterministic, ruby-free
  # tests alone keep coverage at 100% so the no-ruby lanes still pass the gate.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - if: runner.os != 'Windows'
        uses: ruby/setup-ruby@v1
        with:
          # A RELEASED ruby, not head. The oracle compares this library against
          # whatever MRI is installed, so gating on head means gating on a
          # moving upstream: this lane can go red without a line of this
          # repository changing. It did -- re-running the green 2026-08-03 run
          # today, unmodified, fails, because ruby-head's normalisation moved
          # between then and now. A gate that cannot tell "we regressed" from
          # "upstream changed" is not a gate.
          #
          # Early warning against head is still wanted; see the oracle-head
          # job below, which runs the same comparison and is allowed to fail.
          ruby-version: '4.0'
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      - name: CGO-free build (CGO_ENABLED=0)
        shell: bash
        run: CGO_ENABLED=0 go build ./...
      - name: Cross-build for Windows (CGO_ENABLED=0)
        shell: bash
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          COVERPKG=$(go list ./... | paste -sd, -)
          go test -race -coverpkg="$COVERPKG" -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -n 25
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

  # Validate the library on the six supported 64-bit targets. amd64/arm64 run
  # natively; the rest run the suite under qemu-user. The MRI oracle tests skip
  # under qemu (no target-arch ruby), so these lanes exercise the normalizer and
  # the Unicode 16/17 override logic on each architecture via the deterministic
  # suite, which alone holds coverage at 100%.
  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go env GOARCH && go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Test under qemu (${{ matrix.goarch }})
        run: GOARCH=${{ matrix.goarch }} go test -exec=${{ matrix.qemu }} ./...

  wasm:
    name: wasm (${{ matrix.goos }}/wasm)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [js, wasip1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build ${{ matrix.goos }}/wasm
        run: GOOS=${{ matrix.goos }} GOARCH=wasm go build ./...

  # Early warning against ruby-head, deliberately NON-BLOCKING.
  #
  # The oracle compares this library against the installed MRI, so a
  # normalisation change in ruby-head shows up here as a failure even though
  # nothing in this repository moved. That is worth seeing and is not worth
  # blocking a merge on: continue-on-error keeps the signal without letting an
  # upstream nightly decide whether main is green.
  #
  # When this job goes red, the question to ask is which side changed -- run the
  # same commit against the released ruby in the `test` job above, and if that
  # passes, the divergence is upstream's and belongs in an issue rather than in
  # a revert.
  oracle-head:
    name: oracle vs ruby-head (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: head
      - run: ruby -e 'puts RUBY_VERSION'
      - name: Differential oracle against ruby-head
        run: go test -run 'TestOracle' -count=1 ./...
