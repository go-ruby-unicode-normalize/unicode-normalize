name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Track the latest stable Go (org convention). go.mod floor is 1.27.1.
jobs:
  # Build, vet, race-test, and enforce 100% coverage. The differential-vs-MRI
  # oracle tests skip themselves on Windows and where ruby is absent, and gate
  # on RUBY_VERSION >= "4.0" (Unicode 17.0.0); ruby-head is installed on the
  # ubuntu/macos lanes so the oracle runs there. The deterministic, ruby-free
  # tests alone keep coverage at 100% so the no-ruby lanes still pass the gate.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Pinned, not 'stable': golang.org/x/text selects its Unicode tables
          # by toolchain build tag (tables15 behind '!go1.27', tables17 behind
          # 'go1.27'), so a moving toolchain changes the oracle's answer with no
          # commit. Held at 1.26.4 until golang/go#81001 was fixed; unpinned to
          # 1.27.1 on 2026-10-05 after measuring x/text v0.42.0 under go1.27.1:
          # the advisory oracle job passed in CI, and 61/61 tests passed
          # locally against MRI 4.0.5. A bump is now an ordinary reviewed one.
          go-version: '1.27.2'
      - if: runner.os != 'Windows'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: head
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      - name: CGO-free build (CGO_ENABLED=0)
        shell: bash
        run: CGO_ENABLED=0 go build ./...
      - name: Cross-build for Windows (CGO_ENABLED=0)
        shell: bash
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          COVERPKG=$(go list ./... | paste -sd, -)
          go test -race -coverpkg="$COVERPKG" -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -n 25
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

  # Validate the library on the six supported 64-bit targets. amd64/arm64 run
  # natively; the rest run the suite under qemu-user. The MRI oracle tests skip
  # under qemu (no target-arch ruby), so these lanes exercise the normalizer and
  # the Unicode 16/17 characters on each architecture via the deterministic
  # suite, which alone holds coverage at 100%.
  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
      - run: go env GOARCH && go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Test under qemu (${{ matrix.goarch }})
        run: GOARCH=${{ matrix.goarch }} go test -exec=${{ matrix.qemu }} ./...

  wasm:
    name: wasm (${{ matrix.goos }}/wasm)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [js, wasip1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
      - name: Build ${{ matrix.goos }}/wasm
        run: GOOS=${{ matrix.goos }} GOARCH=wasm go build ./...

  # Early warning on the newer toolchain, deliberately NON-BLOCKING.
  #
  # golang.org/x/text picks its Unicode tables by build tag, so a newer Go means
  # a different Unicode implementation underneath this library. That is worth
  # watching and is not something a merge should be blocked on: it is upstream's
  # state, not this repository's.
  #
  # Until golang/go#81001 was fixed, this job FAILED under go1.27, and the
  # failure was upstream's (it passes with x/text v0.42.0 under go1.27.1,
  # measured 2026-10-05, which is why the gating lane is now on 1.27.1 too):
  #
  #   NFKC(U+16D68 U+FB01 U+113C2 U+0300 U+0316)
  #     x/text on go1.27   U+16D68 f U+00EC U+113C2 U+0316
  #     MRI 4.0.6          U+16D68 f i      U+113C2 U+0316 U+0300
  #
  # x/text composed the U+0300 into the i across the ccc-0 U+113C2 and then
  # lost it. A ccc-0 character blocks composition, so MRI is right. Verified
  # against raw norm.NFKC with no patching from this library, and ccc(U+113C2)
  # reads 0 under both table sets.
  #
  # Two local compensations were tried and both were wrong, which is why this is
  # a watch rather than a workaround: composing from NFKD with our own compose
  # pass loses every composition x/text knows and we do not (our table holds the
  # 81 Unicode 16/17 additions, not the full set), and segmenting the input at
  # ccc-0 boundaries breaks Hangul, whose L+V+T jamo are all ccc 0 and must
  # compose across those boundaries -- that one cost 11346 UCD
  # NormalizationTest regressions.
  oracle-stable-toolchain:
    name: oracle on go stable (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
      - run: go version && ruby -e 'puts RUBY_VERSION'
      - name: Differential oracle against MRI
        run: go test -run 'TestOracle' -count=1 ./...
